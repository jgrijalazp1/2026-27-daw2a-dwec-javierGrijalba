<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
        <form id="formulario1">
            <fieldset name="Actividad 2: Lista Desplegable">
                <select name="Colores" id="selectColores">
                    <option value="amarillo">Amarillo</option>
                    <option value="verde">Verde</option>
                    <option value="rojo">Rojo</option>
                </select>
                <button id="btnConfirmar">Confirmar</button>
                <label id="lblResultado" style="background-color: aqua;">     </label>
            </fieldset>
        </form>
    <script defer>
        const lista = document.getElementById("selectColores");
        const resul = document.getElementById("lblResultado");
        
        resul.addEventListener("click", function(){
            resul.innerText = lista.value;
        });
        
    </script>
</body>
</html>
