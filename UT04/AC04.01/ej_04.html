<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="ej_04.css">
</head>
<body>
    <script src="ej_04.js" defer></script>
    <table>
        <tr>
            <td colspan="4"><input type="text" id="txtResul" readonly></td>
        </tr>
        <tr>
            <td><button class="btEscritura" id="bt9" value="9">9</button></td>
            <td><button class="btEscritura" id="bt8" value="8">8</button></td>
            <td><button class="btEscritura" id="bt7" value="7">7</button></td>

        </tr>
        <tr>
            <td><button class="btEscritura" id="bt0" value="0">0</button></td>
            <td><button class="btLimpiar" id="btC" value="C">C</button></td>

        </tr>
