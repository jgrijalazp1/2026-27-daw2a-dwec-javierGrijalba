<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="ej_04.css">
</head>
<body>
    <script src="ej_04.js" defer></script>
    <table>
        <tr>
            <td colspan="4"><input type="text" id="txtResul" readonly></td>
        </tr>
        <tr>
            <td><button class="btEscritura" id="bt9">9</button></td>
            <td><button class="btEscritura" id="bt8">8</button></td>
            <td><button class="btEscritura" id="bt7">7</button></td>
            <td><button class="btEscritura" id="btDividir">/</button></td>
        </tr>
        <tr>
            <td><button class="btEscritura" id="bt6">6</button></td>
            <td><button class="btEscritura" id="bt5">5</button></td>
            <td><button class="btEscritura" id="bt4">4</button></td>
            <td><button class="btEscritura" id="btMulti">*</button></td>
        </tr>
        <tr>
            <td><button class="btEscritura" id="bt3">3</button></td>
            <td><button class="btEscritura" id="bt2" value="2">2</button></td>
            <td><button class="btEscritura" id="bt1">1</button></td>
            <td><button class="btEscritura" id="btMenos">-</button></td>
        </tr>
        <tr>
            <td><button class="btEscritura" id="bt0">0</button></td>
            <td><button class="btLimpiar" id="btC">C</button></td>
            <td><button class="btCalcuar" id="btIgual">=</button></td>
            <td><button class="btEscritura" id="btMas">+</button></td>
        </tr>
    </table>
</body>
</html>
