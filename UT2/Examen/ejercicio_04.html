<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>

        let N = prompt("Introduce un numero entre el 1 y el 10: ");
        let res = 0;
        let parImpar = '';

        // Prefiero usar Number.isInteger porque me parece mas completo.
        // Ademas, usando condiciones concatenadas con '&&', si una no 
        // es 'True', las siguientes no se evaluan, evitando errores.
        if( Number.isInteger && (N > 0) && (N < 11) ){
            for(i = 1; i <= 10; i++){
                res = N * i;
                // Calculo res y si res es par o impar
                if(res % 2 == 0){
                    parImpar = 'par';
                }else{
                    parImpar = 'impar';
                } 
                console.log(N + " x " + i + " = " + res + " -> " + parImpar);
            }
        }else{
            alert("Numero no valido");
        }

    </script>
</body>
</html>
