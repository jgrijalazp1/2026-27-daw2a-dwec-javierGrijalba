<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>

        // Pido un numero del 1 al 7
        let numero = prompt("Introduce un numero del 1 al 7: ");

        // Lo parseo a entero
        numero = parseInt(numero);

        // Emito la salida de obtenerDiaSemana
        alert("Dia equivalente: " + obtenerDiaSemana(numero));

        // Dado un numero entero entre 1 y 7, devuelve el correspondiente
        // nombre del dia de la semana
        function obtenerDiaSemana(num){
            switch(num){
                case 1: return "Lunes";
                break;
                case 2: return "Martes"; 
                break;
                case 3: return "Miercoles"; 
                break;
                case 4: return "Jueves";
                break;
                case 5: return "Viernes";
                break;
                case 6: return "Sabado"; 
                break;
                case 7: return "Domingo"
                break;
                default: return "dia no valido";
            }
        }

    </script>
</body>
</html>
