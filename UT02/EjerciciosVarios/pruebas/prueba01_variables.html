<!DOCTYPE html>
<html>
    <head>
        <script defer>
            let $$$ = 2;
            let $myMoney = 5;
            document.getElementById("demo").innerHTML = $$$ + $myMoney;
    </script>
    </head>

    <body>
        <h1>JavaScript Variables</h1>
        <p>The dollar sign is treated as a letter in JavaScript names.</p>
        <p id="demo"></p>
    </body>
</html>
